[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-trading"
version = "0.1.0"
description = "Personal ML4T-topic implementations (data loader, cleaning, time splits first)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
fetch-ml4t = "ml_trading.fetch:main"

[tool.setuptools.packages.find]
include = ["ml_trading*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
